syntax = "proto3";

package grpc_statistics_service;

import "google/protobuf/timestamp.proto";
import "google/protobuf/duration.proto";

service StatisticsService {
  rpc AddExpense (AddExpenseRequest) returns (AddExpenseResponse);
  rpc GetAverageReceipt (GetAverageReceiptRequest) returns (GetAverageReceiptResponse);
  rpc GetDeposits (GetDepositsRequest) returns (GetDepositsResponse);
  rpc GetProductSales (GetProductSalesRequest) returns (GetProductSalesResponse);
  rpc GetExpenses (GetExpensesRequest) returns (GetExpensesResponse);
}

message TimeRange {
  google.protobuf.Timestamp start_timestamp = 2;
  google.protobuf.Timestamp end_timestamp = 3;
  google.protobuf.Duration step = 4;
}

message DataPoints {
  repeated double values = 1;
  TimeRange time_range = 2;
}

message AddExpenseRequest {
  int64 amount_in_kopecks = 1;
  google.protobuf.Timestamp timestamp = 2;
}

message AddExpenseResponse {}

message GetAverageReceiptRequest {
  TimeRange time_range = 1;
}

message GetAverageReceiptResponse {
  DataPoints data = 1;
}

message GetDepositsRequest {
  TimeRange time_range = 1;
}

message GetDepositsResponse {
  DataPoints data = 1;
}

message GetProductSalesRequest {
  string product_name = 1;
  TimeRange time_range = 2;
}

message GetProductSalesResponse {
  DataPoints data = 1;
}

message GetExpensesRequest {
  TimeRange time_range = 1;
}

message GetExpensesResponse {
  DataPoints data = 1;
}