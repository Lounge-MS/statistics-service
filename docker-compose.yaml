services:
  statistics-postgres:
    container_name: statistics-postgres
    image: postgres:latest
    networks:
      - statistics-network
    ports:
      - "5431:5432"
    environment:
      POSTGRES_DB: "postgres"
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "postgres"
    volumes:
      - statistics-data:/data/postgres
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 3s
      retries: 5

  statistics-kafka:
    container_name: statistics-kafka
    image: apache/kafka:latest
    networks:
      - statistics-network
    ports:
      - "9094:9094"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:9094,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://statistics-kafka:9092,EXTERNAL://localhost:9094
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_CREATE_TOPICS: >
        CheckClosedEvent:1:1,
    volumes:
      - statistics-checks-kafka-data:/kafka-data

  statistics-kafka-ui:
    container_name: statistics-kafka-ui
    image: provectuslabs/kafka-ui:latest
    networks:
      - statistics-network
    build:
      context: .
    restart: unless-stopped
    depends_on:
      - statistics-kafka
    ports:
      - "8082:8080"
    volumes:
      - ./src/statisticsingServiceProject/Protos:/schemas
    environment:
      kafka.clusters.0.name: statistics-kafka
      kafka.clusters.0.bootstrapServers: statistics-kafka:9092
      kafka.clusters.0.defaultKeySerde: ProtobufFile
      kafka.clusters.0.defaultValueSerde: ProtobufFile

      kafka.clusters.0.serde.0.name: ProtobufFile
      kafka.clusters.0.serde.0.properties.protobufFilesDir: /schemas/

      kafka.clusters.0.serde.0.properties.protobufMessageNameForKeyByTopic.CheckClosedEvent: grpc_statisticsing_service.kafka.ClosedCheckKey
      kafka.clusters.0.serde.0.properties.protobufMessageNameForValueByTopic.CheckClosedEvent: grpc_statisticsing_service.kafka.ClosedCheckValue

networks:
  statistics-network:
    driver: bridge

volumes:
  statistics-checks-kafka-data:
  statistics-data: